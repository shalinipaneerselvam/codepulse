<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Count Characters</title>
    <style>
        body{font-family:Arial;background:#f4f7f6;margin:0}
        nav{background:#198754;color:white;padding:18px 40px;font-size:22px;font-weight:bold}
        .container{width:90%;max-width:800px;margin:40px auto}
        .back{color:#198754;text-decoration:none;font-weight:bold}
        .card{background:white;padding:30px;border-radius:12px;box-shadow:0 3px 12px #ddd;margin-top:25px}
        input{width:100%;padding:12px;margin:10px 0;box-sizing:border-box;border:1px solid #ccc;border-radius:7px}
        button{background:#198754;color:white;border:0;padding:12px 22px;border-radius:7px}
        .result{margin-top:20px;background:#e8f5e9;padding:15px;border-radius:8px}
        pre{background:#222;color:#fff;padding:20px;border-radius:8px}
    </style>
</head>
<body>
<nav>⚡ CodePulse</nav>

<div class="container">
    <a href="/practice/strings" class="back">← Back to Strings</a>

    <div class="card">
        <h1>Count Characters</h1>
        <p>Count characters in the given string, ignoring spaces.</p>

        <p><b>Example:</b> Hello World → 10</p>

        <form method="post" action="/practice/string/count-characters">
            <input type="text" name="text" placeholder="Enter a string" required>
            <button type="submit">Solve</button>
        </form>

        <div class="result" th:if="${result}">
            <b>Result:</b> <span th:text="${result}"></span>
        </div>

        <h2>Java Solution</h2>
        <pre><code>int count = 0;

for(char ch : text.toCharArray()) {
    if(!Character.isWhitespace(ch)) {
        count++;
    }
}

System.out.println(count);</code></pre>
    </div>
</div>
</body>
</html>
